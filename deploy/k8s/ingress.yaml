apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: drafftink
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: drafftink.example.com
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: drafftink-relay
                port:
                  number: 3030
          - path: /
            pathType: Prefix
            backend:
              service:
                name: drafftink-static
                port:
                  number: 80
